name: fmt-ra
on:
  workflow_dispatch:
    inputs:
      branch:
        description: branch to format
        default: mysql-charset-introducers
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: install crs-toolchain
        run: |
          cd /tmp
          curl -sL -o t.tgz https://github.com/coreruleset/crs-toolchain/releases/download/v2.10.0/crs-toolchain_2.10.0_linux_amd64.tar.gz
          tar xzf t.tgz
          sudo mv crs-toolchain /usr/local/bin/
      - name: format all
        run: |
          git status --porcelain
          crs-toolchain regex format --all
          git status --porcelain
          git diff --stat
      - name: commit
        run: |
          git config user.name "kosoyyagent"
          git config user.email "kosoyyagent@users.noreply.github.com"
          git add -A -- regex-assembly
          git diff --cached --quiet || git commit -m "chore(formatting): crs-toolchain format --all"
          git push origin HEAD:${{ inputs.branch }}
