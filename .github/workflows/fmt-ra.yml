name: fmt-ra
on:
  workflow_dispatch:
    inputs:
      branch:
        description: branch to format
        default: mysql-charset-introducers
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: install crs-toolchain
        run: |
          curl -sL -o t.tgz https://github.com/coreruleset/crs-toolchain/releases/download/v2.10.0/crs-toolchain_2.10.0_linux_amd64.tar.gz
          tar xzf t.tgz
          ./crs-toolchain --version || true
          sudo mv crs-toolchain /usr/local/bin/ || mv crs-toolchain $HOME/bin/ && mkdir -p $HOME/bin
      - name: format include
        run: |
          crs-toolchain regex format mysql-charset-names || crs-toolchain regex format --all
          git status --porcelain
          git diff
      - name: commit
        run: |
          git config user.name "kosoyyagent"
          git config user.email "kosoyyagent@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(formatting): crs-toolchain format mysql-charset-names"
          git push origin HEAD:${{ inputs.branch }}
